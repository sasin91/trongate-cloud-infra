---
# TRONGATE-CLOUD: the encrypted Secrets trongate.cloud's deploy/k8s reads.
#
# deploy/k8s/README.md offers two homes for them; this repository is the one
# chosen, so the app repository never holds ciphertext for this cluster and
# never needs this cluster's age recipient.
#
# Create each file from the example NEXT TO THE MANIFESTS THAT USE IT in
# trongate.cloud (copying keeps one source of truth for the keys), fill it in,
# encrypt it, then uncomment its line here:
#
#   T=~/Herd/trongate.cloud/deploy/k8s
#   cp $T/databases/secrets.example.yaml  databases.sops.yaml       # mariadb-shared-1
#   cp $T/cache/secrets.example.yaml      cache.sops.yaml           # valkey-acl
#   cp $T/files/secrets.example.yaml      files.sops.yaml           # juicefs-meta, juicefs-secret
#   cp $T/platform/secrets.example.yaml   trongate-cloud.sops.yaml  # env, mcp, registry-push, mariadb-platform
#   (trongate-cloud-github from the same example lives in github.sops.yaml)
#   # edit, then for each:
#   sops --encrypt --in-place <file>
#
# ORDERING, stated rather than hidden: these Secrets land in namespaces that
# trongate.cloud's own Kustomization creates (databases, cache, files,
# trongate-cloud). On the very first reconcile this one can run before those
# namespaces exist; it then fails with "namespace not found" and succeeds on
# its next retry (1m), while the MariaDB and Valkey objects that need the
# Secrets wait. It is not wired the other way round (dependsOn trongate-cloud)
# because that Kustomization cannot become Ready until these Secrets exist.
#
# Empty until the files exist: a kustomization naming a missing file fails.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - databases.sops.yaml
  - cache.sops.yaml
  # JuiceFS data in the trongate-cloud-fsn1-juicefs bucket.
  - files.sops.yaml
  - trongate-cloud.sops.yaml
  # The GitHub App (trongate.cloud docs/github-app.md): sign-in, webhook,
  # installation tokens. Read by the app and the worker (optional secretRef).
  - github.sops.yaml
