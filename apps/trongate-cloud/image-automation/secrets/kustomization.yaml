# Both in flux-system, beside the image automation objects that use them
# (--no-cross-namespace-refs).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Write deploy key on this repository; the ImageUpdateAutomation pushes with it.
  - infra-write-deploy-key.sops.yaml
  # The registry's pull user, for the ImageRepository. Create it from its
  # .example, then uncomment:
  # - registry-pull.sops.yaml
