---
# trongate.cloud's platform MariaDB NetworkPolicy admits this namespace by
# name (kubernetes.io/metadata.name: mariadb-operator); keep the name.
apiVersion: v1
kind: Namespace
metadata:
  name: mariadb-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 12h
  releaseName: mariadb-operator-crds
  targetNamespace: mariadb-operator
  storageNamespace: mariadb-operator
  chart:
    spec:
      chart: mariadb-operator-crds
      # 26.10.1 -- highest 26.10.x in https://helm.mariadb.com/mariadb-operator/index.yaml
      # on 2026-10-03 (trongate.cloud asks for 26.10.x).
      version: 26.10.1
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 12h
  releaseName: mariadb-operator
  targetNamespace: mariadb-operator
  storageNamespace: mariadb-operator
  dependsOn:
    - name: mariadb-operator-crds
  chart:
    spec:
      chart: mariadb-operator
      # 26.10.1 (image ghcr.io/mariadb-operator/mariadb-operator:26.10.1,
      # amd64+arm64; default MariaDB image mariadb:12.3.3, amd64+arm64).
      version: 26.10.1
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  # Chart defaults, as in trongate.cloud: the operator watches all namespaces,
  # which tenant Database/User/Grant CRs in tc-team-* referencing the MariaDB
  # in "databases" rely on.
  values: {}
