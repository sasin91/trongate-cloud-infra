---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: juicefs-csi-driver
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 12h
  releaseName: juicefs-csi-driver
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: juicefs-csi-driver
      # 0.33.0 (driver juicedata/juicefs-csi-driver:v0.33.0 and the CE mount
      # image, both amd64+arm64) -- the only 0.33.x on 2026-10-03.
      version: 0.33.0
      sourceRef:
        kind: HelmRepository
        name: juicefs
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  # Same values as trongate.cloud's deploy/k8s/operators/juicefs-csi.yaml.
  # The chart's webhook gets its certificate from cert-manager, which the
  # infrastructure layer this depends on installs.
  values:
    # The StorageClass is trongate.cloud's (deploy/k8s/files/storageclass.yaml)
    storageClasses: []
    controller:
      # In-house provisioner: needed for pathPattern ("{namespace}-{pvc}" directories)
      provisioner: true
    node:
      # One mount pod per node for every tenant-files PVC instead of one per PVC
      storageClassShareMount: true
