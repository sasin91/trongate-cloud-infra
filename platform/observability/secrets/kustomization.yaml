---
# The secrets of this layer, as their own kustomization.
#
# WHY A DIRECTORY AND NOT A FILE REFERENCE. ../controllers cannot list
# `../secrets/grafana-admin.sops.yaml` directly: kustomize refuses to load a
# FILE from outside its own directory ("file is not in or below" ...), while a
# sibling DIRECTORY carrying its own kustomization.yaml is a legitimate base.
# The instruction to add the file path was wrong and could not be followed.
#
# WHY THE LIST IS EMPTY. The secret does not exist until you create it, and a
# kustomization naming a missing file fails to build -- which would stop this
# entire layer rather than just Grafana.
#
# DO NOT DELETE THIS FILE because it looks pointless. Without it, ../controllers
# cannot reference this directory at all.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-admin.sops.yaml
