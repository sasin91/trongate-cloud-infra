---
# Stage two of this layer: objects whose custom resource definitions are
# installed by ../controllers.
#
# The cluster reconciliation pointing here MUST declare a dependency on the one
# pointing at ../controllers. Without it the first apply fails on missing
# definitions, retries, and eventually succeeds — which reads as flakiness
# rather than as a missing dependency edge, and is how an ordering bug survives
# for years without anybody calling it a bug.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - scrapes.yaml
  # TRONGATE-CLOUD metrics-only trim: the probes need blackbox-exporter, which
  # is off (../controllers/kustomization.yaml). The blackbox and Vector scrapes
  # in scrapes.yaml stay; with nothing to select they scrape nothing. The
  # VMRules stay too and are evaluated again once vmalert is back.
  # - probes.yaml
  - rules-platform.yaml
  - rules-tenant-guarantees.yaml
  - rules-loaded.yaml
