---
# Stage one of this layer: the namespace, the chart sources, and the releases.
#
# Split from ../configs on purpose. Everything in this directory installs
# custom resource definitions; everything in ../configs consumes them. A
# resource whose definition has not been established yet fails, retries, and
# eventually succeeds — which reads as flakiness rather than as a missing
# dependency edge, and is how ordering bugs survive for years.
#
# The cluster reconciliation for ../configs must therefore declare dependsOn
# this one. See ../README.md.
#
# ../secrets IS listed below, as a directory. It is empty until a fork creates
# the Grafana admin credential -- see ../secrets/kustomization.yaml for why the
# reference is to the directory and not to the file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sources.yaml
  - victoria-metrics-k8s-stack.yaml
  - victoria-logs.yaml
  # TRONGATE-CLOUD single-node profile: no trace pipeline. Tempo (512Mi-2Gi and
  # a 20Gi volume) and the collector (192Mi-512Mi) are the least-used third of
  # the stack on a cluster whose only spans would come from the ingress.
  # Metrics, logs, alerting and Grafana stay. To restore: uncomment both,
  # restore Traefik's tracing block (platform/controllers/releases/
  # ingress.yaml), the Tempo datasource, scrape and probe target.
  # - otel-collector.yaml
  # - tempo.yaml
  - blackbox-exporter.yaml
  # A directory, not a file. kustomize refuses to load a file from outside its
  # own directory; a sibling directory with its own kustomization is fine.
  - ../secrets
