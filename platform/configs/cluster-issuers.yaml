---
# TRONGATE-CLOUD: the issuers the platform Gateway uses, HTTP-01.
#
# The kit keeps these in optional/ because they need an email address and a
# placeholder one is rejected. Let's Encrypt made the contact optional and
# stopped sending expiry mail in 2025, so these carry none and can live in the
# default path. Expiry is watched by the observability stack.
#
# HTTP-01 covers the exact hostnames: trongate.cloud and
# registry.trongate.cloud. It cannot cover *.apps.trongate.cloud; that needs a
# DNS-01 solver for wherever the zone lives (Porkbun today).
#
# Start on staging (the Gateway's annotation), switch to letsencrypt once a
# staging certificate has been issued.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: platform
                namespace: traefik
                kind: Gateway
                group: gateway.networking.k8s.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: platform
                namespace: traefik
                kind: Gateway
                group: gateway.networking.k8s.io
