---
# The ingress controller. Traefik, because it is the distribution's own and the
# one the cluster module already knows how to not install.
#
# READ THIS BEFORE CHANGING replicas OR THE DISRUPTION BUDGET.
#
# The single-replica ingress is the most widely copied configuration in this
# whole stack, and its cause is a certificate store: an ingress controller with
# a built-in ACME client writes certificate state to a local file, so replicas
# race and reissue against each other. Every guide therefore pins the ingress
# to one replica — and then, because one replica cannot satisfy a disruption
# budget, disables the budget too.
#
# cert-manager removes the cause (see cert-manager.yaml). This file removes the
# effects. That is the whole point: when you remove a cause, go and hunt its
# effects, because the comment explaining a constraint is exactly what makes it
# look deliberate long after it stopped being true.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  # REQUIRED. The lockdown flag --default-service-account=default means a
  # HelmRelease naming no account reconciles as the namespace's default
  # service account, which has no permissions -- helm-controller then cannot
  # even read the secrets Helm stores release state in, and the release fails
  # with a message about querying storage rather than about permissions.
  # Verified on a live cluster: without this, the platform layer cannot
  # install itself under the kit's own lockdown flags.
  serviceAccountName: helm-controller
  interval: 12h
  releaseName: traefik
  targetNamespace: traefik
  storageNamespace: traefik
  chart:
    spec:
      chart: traefik
      # 41.1.1 (application v3.7.9) — latest chart tag, read from the GitHub
      # releases of traefik/traefik-helm-chart and confirmed present in
      # oci://ghcr.io/traefik/helm/traefik on 2026-08-03.
      version: 41.1.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:

    # TRACING. Without this the trace store is installed, healthy, and empty --
    # which is what this kit shipped until a live cluster proved it. Enabling it
    # here means the store is non-empty from the first request that crosses the
    # gateway, before anybody instruments an application.
    #
    # Exported to the collector rather than straight to the store, so gateway
    # spans carry the same cluster metadata as application spans and the two can
    # be joined.
    #
    # The value shapes below were corrected against this chart's own schema after
    # a live upgrade rejected the obvious guess: access logs are `accessLog` at
    # the top level, not nested under `logs`, and the chart sets
    # `additionalProperties: false` so a wrong key fails the release rather than
    # being ignored. That is the good failure mode, and it is worth saying so --
    # a chart that silently accepted an unknown key would have left tracing off
    # while reporting success.
    # TRONGATE-CLOUD: tracing OFF. The single-node profile does not run the
    # collector or Tempo (see platform/observability/controllers), and exporting
    # to an address that does not exist only produces retry noise. Restore the
    # block below together with those two releases.
    #
    # tracing:
    #   sampleRate: 1.0
    #   addInternals: false
    #   otlp:
    #     enabled: true
    #     grpc:
    #       enabled: true
    #       endpoint: opentelemetry-collector.observability.svc.cluster.local:4317
    #       insecure: true

    # The access log carries trace and span identifiers, which is what lets a log
    # line lead to a request and a request lead back to its logs. Shipping traces
    # and logs to the same platform is not correlation; this is.
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          # Headers carry credentials far more often than anyone intends.
          defaultMode: drop
    # TRONGATE-CLOUD: per-router request metrics for trongate.cloud's Traffic
    # cards (requests, status classes, response times per app and project).
    # Router labels are off by default; Traefik names a Gateway API router
    # httproute-{namespace}-{route}-gw-..., so each app's routers are found by
    # its HTTPRoute name. The platform worker reads each pod's metrics port
    # (9100, pod-only, not exposed) every minute and keeps the counts in
    # MariaDB; nothing else scrapes it. The buckets MUST match
    # App_traffic::LE_COLUMNS in the app repository.
    metrics:
      prometheus:
        addRoutersLabels: true
        buckets: "0.025,0.05,0.1,0.25,0.5,1,2.5,5,10"

    # TRONGATE-CLOUD: back to the kit's ingress HA now that there are two
    # nodes and a load balancer (2026-10-04): one replica per node, a
    # disruption budget, required anti-affinity.
    deployment:
      replicas: 2

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: '{{ template "traefik.name" . }}'
                app.kubernetes.io/instance: '{{ .Release.Name }}-{{ include "traefik.namespace" . }}'
            topologyKey: kubernetes.io/hostname

    # TRONGATE-CLOUD: the Sablier plugin. trongate.cloud's worker puts a
    # traefik.io Middleware using it in front of every scale-to-zero app
    # (Manifests::SABLIER_PLUGIN must match the name "sablier"). Traefik
    # downloads the plugin source from GitHub at start-up.
    #
    # v1.3.0, not v1.3.1: plugins.traefik.io's integrity check rejects the
    # v1.3.1 archive ("plugin integrity check failed"), and when one plugin
    # fails Traefik disables ALL plugins, so every Sablier route 404s. Checked
    # 2026-10-06 against /public/validate: v1.0.1..v1.3.0 pass, v1.3.1 fails.
    # Before bumping, check the Traefik start-up log for "Plugins are disabled".
    experimental:
      plugins:
        sablier:
          moduleName: github.com/sablierapp/sablier-traefik-plugin
          version: v1.3.0

    # NO CERTIFICATE RESOLVER. Empty on purpose, and checked in CI: an ACME
    # resolver configured here alongside cert-manager means somebody
    # reintroduced the race that the whole arrangement exists to remove.
    certificatesResolvers: {}

    providers:
      # HTTP routing is Gateway API and nothing else.
      #
      # This is not tidiness. Tenant hostnames are authorised by an admission
      # policy that targets HTTPRoute (see
      # platform/configs/httproute-hostname-policy.yaml). Any other enabled
      # route source — Ingress, or this controller's own IngressRoute — is a
      # second, unpoliced way to claim the same hostname, and an inner control
      # that only covers one of two doors is one layer wearing a costume.
      #
      # TRONGATE-CLOUD: kubernetesCRD is ON, because a Gateway API ExtensionRef
      # filter can only name a traefik.io Middleware when this provider is
      # enabled, and Sablier is such a Middleware. That reopens IngressRoute as
      # a second door; platform/configs/admission/deny-traefik-routes.yaml shuts
      # it by refusing IngressRoute, IngressRouteTCP and IngressRouteUDP
      # everywhere. Middlewares stay namespace-local (allowCrossNamespace).
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: false
        allowExternalNameServices: false
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
        # Standard channel only. The experimental channel would enable TCPRoute
        # and TLSRoute through this proxy; long-lived connection protocols are
        # deliberately kept off the ingress, because a reverse proxy is a shared
        # restart domain and every ingress rollout would drop every session.
        experimentalChannel: false
        statusAddress:
          service:
            # Copy the load balancer's address onto the Gateway's status, so
            # `kubectl get gateway` answers "where does this actually live".
            enabled: true

    # The GatewayClass is created by the chart — it names this controller, so
    # it belongs with this controller.
    gatewayClass:
      enabled: true
      name: traefik

    # The Gateway is NOT created by the chart. It is a platform-owned object
    # that references a certificate Secret and decides which namespaces may
    # attach routes, and it lives in platform/configs/gateway.yaml where the
    # definitions it needs are already established. A Gateway rendered by the
    # chart would also be recreated with chart defaults on every upgrade.
    gateway:
      enabled: false

    # No IngressClass: nothing here serves Ingress objects, and a default
    # IngressClass that serves nothing is a trap for the first person who
    # writes an Ingress and waits for it to work.
    ingressClass:
      enabled: false
      isDefaultClass: false

    # No dashboard. It is a query interface onto the routing table, and the
    # safest configuration for an interface like that is the one that does not
    # exist.
    api:
      dashboard: false
    ingressRoute:
      dashboard:
        enabled: false

    service:
      spec:
        type: LoadBalancer
        # TRONGATE-CLOUD: Cluster, the kit's behaviour behind a Hetzner load
        # balancer. Client addresses are not preserved yet: that needs the
        # PROXY protocol pair below plus the load-balancer.hetzner.cloud/hostname
        # annotation (otherwise in-cluster clients of the LB address, such as
        # build pods pushing to registry.trongate.cloud, bypass the balancer and
        # send no PROXY header). Left for later.
        externalTrafficPolicy: Cluster
      # TRONGATE-CLOUD: an lb11 in fsn1 (EUR 7.49/month, 2026-10-04), created by
      # the cloud controller because enable_klipper_lb = false.
      annotations:
        # The only provider-coupled lines in platform/. They have to be here:
        # this Service is what causes a load balancer to exist.
        #
        # CHANGE BOTH. The location must be one the cluster's nodes are in, and
        # the type must be one currently available there — "supported" and
        # "available" are different things in this provider's API, and a
        # location or type that is merely supported applies cleanly and then
        # fails when the balancer is created.
        # A REAL DEFAULT, NOT A PLACEHOLDER. A "CHANGE-ME" here does not fail
        # loudly -- the release installs, reports success, and the cloud
        # controller then rejects the value with "location or network zone not
        # found" in a Service event nobody reads. The result is an ingress with
        # no address, on a cluster that looks healthy. Verified on a live
        # cluster, where it retried silently for fifty minutes.
        #
        # MUST MATCH the location your nodes are in -- see the node layer's
        # control_plane_location. A load balancer in another location cannot
        # reach them over the private network.
        load-balancer.hetzner.cloud/location: "fsn1"
        load-balancer.hetzner.cloud/type: "lb11"
        # Reach the nodes over the private network rather than their public
        # addresses. Keeps the hop off the internet and out of the firewall.
        load-balancer.hetzner.cloud/use-private-ip: "true"
        #
        # CLIENT IP ADDRESSES ARE NOT PRESERVED BY DEFAULT, and no
        # externalTrafficPolicy setting changes that here: this provider's load
        # balancer terminates the connection and opens a new one, so every
        # request arrives from the balancer. Recovering the real address needs
        # PROXY protocol, which is two changes that must be made together —
        # uncomment both or neither. Enabling the annotation alone breaks every
        # request; enabling the entrypoint alone, or trusting a range wider than
        # the balancer, lets a client forge its own address.
        #
        # load-balancer.hetzner.cloud/uses-proxyprotocol: "true"

    # ports:
    #   web:
    #     proxyProtocol:
    #       trustedIPs:
    #         - "10.0.0.0/8"   # the cluster's private network range, and nothing wider
    #   websecure:
    #     proxyProtocol:
    #       trustedIPs:
    #         - "10.0.0.0/8"

    # NO ENTRYPOINT-LEVEL HTTP-TO-HTTPS REDIRECT, deliberately.
    #
    # An entrypoint redirect rewrites every request on port 80, including
    # `/.well-known/acme-challenge/...`. The HTTP-01 solver's request would be
    # redirected to a port whose certificate does not exist yet, so issuance
    # fails and keeps failing in a way that looks like a certificate problem.
    # The redirect is done as a route on the Gateway's HTTP listener instead,
    # where an exact-path match for the challenge takes precedence over it.
    # See platform/configs/gateway.yaml.

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        # A memory limit, because the chart derives GOMEMLIMIT from it and an
        # unbounded proxy is the thing that takes a node down with it. No CPU
        # limit: throttling a latency-sensitive proxy converts a busy moment
        # into a queue, and every request behind it pays.
        memory: 256Mi
